name: MacOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "macos-15-intel" # x86_64
          - "macos-15"       # arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and Test
        run: ./scripts/feature-tests.shell
