name: Linux (gcc)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install gcc 14
        run: sudo apt-get update && sudo apt-get install -y g++-14

      - name: Build and Test
        run: ./scripts/feature-tests.shell
