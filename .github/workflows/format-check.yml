name: code-style

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 22
      - name: Run clang-format
        run: |
          chmod +x ./code_style_check.sh
          ./code_style_check.sh
        shell: bash
